! Cisco Catalyst 2960 Layer-2 Switch Configuration
! Project: Multi-Department Enterprise Campus Network Architecture
! Author: Konda Sneha (CCNA Certified)
!
version 15.0
service password-encryption
!
hostname SW-Access-01
!
! VLAN Database Setup
vlan 10
 name Management
!
vlan 20
 name Engineering
!
vlan 30
 name Accounts
!
vlan 40
 name Guest-WiFi
!
vlan 99
 name Native-VLAN
!
spanning-tree mode rapid-pvst
!
! 802.1Q Trunk Link to Core Router / Distribution Switch
interface GigabitEthernet0/1
 description Trunk Link to Core
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,99
!
! Access Ports with Port Security Enabled
interface range FastEthernet0/1 - 10
 description Management PC Ports (VLAN 10)
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation shutdown
 switchport port-security mac-address sticky
 spanning-tree portfast
!
interface range FastEthernet0/11 - 20
 description Engineering PC Ports (VLAN 20)
 switchport mode access
 switchport access vlan 20
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation shutdown
 switchport port-security mac-address sticky
 spanning-tree portfast
!
! Unused Ports Shutdown (Security Best Practice)
interface range FastEthernet0/21 - 24
 shutdown
!
line con 0
 password 7 0822455D0A16
 login
!
line vty 0 4
 transport input ssh
 login local
!
end
