! Cisco 2911 ISR Core Router Configuration
! Project: Multi-Department Enterprise Campus Network Architecture
! Author: Konda Sneha (CCNA Certified)
!
version 15.4
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname Core-RTR-01
!
boot-start-marker
boot-end-marker
!
enable secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
!
username sneha privilege 15 secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
!
ip domain-name enterprise.local
crypto key generate rsa modulus 2048
!
! Sub-interfaces for Inter-VLAN Routing (Router-on-a-Stick)
interface GigabitEthernet0/0
 no ip address
 duplex auto
 speed auto
 no shutdown
!
interface GigabitEthernet0/0.10
 description Management VLAN 10 Gateway
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0
 ip nat inside
!
interface GigabitEthernet0/0.20
 description Engineering VLAN 20 Gateway
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
 ip nat inside
!
interface GigabitEthernet0/0.30
 description Accounts & Finance VLAN 30 Gateway
 encapsulation dot1Q 30
 ip address 192.168.30.1 255.255.255.0
 ip access-group 110 in
 ip nat inside
!
interface GigabitEthernet0/0.40
 description Guest WiFi VLAN 40 Gateway
 encapsulation dot1Q 40
 ip address 192.168.40.1 255.255.255.0
 ip access-group 120 in
 ip nat inside
!
! WAN Interface connecting to Edge Gateway
interface GigabitEthernet0/1
 description WAN Uplink to ISP
 ip address 203.0.113.2 255.255.255.252
 ip nat outside
 duplex auto
 speed auto
 no shutdown
!
! Single-Area OSPFv2 Routing Configuration
router ospf 1
 router-id 1.1.1.1
 log-adjacency-changes
 passive-interface GigabitEthernet0/0.10
 passive-interface GigabitEthernet0/0.20
 passive-interface GigabitEthernet0/0.30
 passive-interface GigabitEthernet0/0.40
 network 192.168.10.0 0.0.0.255 area 0
 network 192.168.20.0 0.0.0.255 area 0
 network 192.168.30.0 0.0.0.255 area 0
 network 192.168.40.0 0.0.0.255 area 0
 default-information originate
!
! Default Route to WAN Gateway
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
! Dynamic PAT (Overload) Configuration
ip access-list standard NAT-PERMIT
 permit 192.168.10.0 0.0.0.255
 permit 192.168.20.0 0.0.0.255
 permit 192.168.30.0 0.0.0.255
 permit 192.168.40.0 0.0.0.255
!
ip nat inside source list NAT-PERMIT interface GigabitEthernet0/1 overload
!
! Extended ACL: Restrict Accounts VLAN access from Guest VLAN
access-list 110 permit tcp 192.168.10.0 0.0.0.255 192.168.30.0 0.0.0.255 eq 443
access-list 110 permit tcp 192.168.20.0 0.0.0.255 192.168.30.0 0.0.0.255 eq 443
access-list 110 deny ip any 192.168.30.0 0.0.0.255
access-list 110 permit ip any any
!
! Extended ACL: Isolate Guest WiFi from all corporate LAN subnets
access-list 120 deny ip 192.168.40.0 0.0.0.255 192.168.10.0 0.0.0.255
access-list 120 deny ip 192.168.40.0 0.0.0.255 192.168.20.0 0.0.0.255
access-list 120 deny ip 192.168.40.0 0.0.0.255 192.168.30.0 0.0.0.255
access-list 120 permit ip 192.168.40.0 0.0.0.255 any
!
! Device Hardening: SSH v2 Only & Telnet Blocked
ip ssh version 2
!
line con 0
 password 7 0822455D0A16
 login
 transport output none
!
line vty 0 4
 transport input ssh
 login local
 exec-timeout 10 0
!
end
